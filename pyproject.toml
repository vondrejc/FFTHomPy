[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffthompy"
version = "1.0.4.dev0"
description = "FFT-based homogenization in Python"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Jaroslav Vondřejc", email = "vondrejc@gmail.com"}]
dependencies = [
    "numpy>=1.26.4,<3",
    "scipy>=1.11.4,<2",
    "seemps>=3.0,<4",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[project.urls]
Repository = "https://github.com/vondrejc/FFTHomPy"
Documentation = "https://ffthompy.bitbucket.io/"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["ffthompy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
